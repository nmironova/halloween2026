<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090a0a">
    <title>Containment Announcements</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090a0a;
        --panel: #111413;
        --line: #383d39;
        --text: #e5e7e4;
        --muted: #9da49f;
        --green: #83e89d;
        --red: #ef6259;
        --mono: Consolas, 'Courier New', monospace;
        --sans: 'Arial Narrow', 'Franklin Gothic Medium', Arial, sans-serif;
      }

      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 35%, #191d19, #090a0a 72%);
        color: var(--text);
        font-family: var(--mono);
      }

      main {
        width: min(760px, 100%);
        padding: 26px;
        border: 1px solid var(--line);
        background: linear-gradient(145deg, #171a18, #0d100e 70%);
        box-shadow: 0 24px 80px #000b;
      }

      .eyebrow { color: var(--green); font-size: 10px; }
      h1 { margin: 9px 0 6px; font: 800 32px/1.05 var(--sans); }
      .subtitle { margin: 0 0 22px; color: var(--muted); font-size: 12px; }
      .status { margin-bottom: 14px; padding: 12px; border: 1px solid var(--line); color: var(--green); font-size: 11px; }
      .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      button { min-height: 74px; padding: 14px; border: 1px solid #477451; background: #14251a; color: #e4ffe9; font: 700 16px var(--mono); cursor: pointer; }
      button:hover { border-color: var(--green); background: #1a3322; }
      button:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
      button:active { background: #23432d; }
      .stop { width: 100%; min-height: 54px; margin-top: 10px; border-color: #9d4640; background: #321715; color: #ffc0b8; }
      .stop:hover { border-color: var(--red); background: #491e1a; }
      @media (max-width: 560px) {
        body { padding: 14px; }
        main { padding: 18px; }
        .controls { grid-template-columns: 1fr; }
        button { min-height: 58px; }
        h1 { font-size: 28px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">AUDIO CONTROL / LOCAL ANNOUNCEMENTS</div>
      <h1>CONTAINMENT ANNOUNCEMENTS</h1>
      <p class="subtitle">SELECT LANGUAGE</p>
      <div class="status" id="status" role="status" aria-live="polite">AUDIO SYSTEM READY</div>
      <div class="controls">
        <button type="button" data-language="SERBIAN">SERBIAN</button>
        <button type="button" data-language="ENGLISH">ENGLISH</button>
        <button type="button" data-language="RUSSIAN">RUSSIAN</button>
      </div>
      <button class="stop" id="stop" type="button">STOP</button>
      <audio id="announcement" preload="auto"></audio>
    </main>
    <script>
      const files = {
        SERBIAN: './sounds/serbian_zombies_announcement.mp3',
        ENGLISH: './sounds/english_zombies_announcement.mp3.mp3',
        RUSSIAN: './sounds/russian_zombies_announcement.mp3.mp3',
      };
      const audio = document.getElementById('announcement');
      const status = document.getElementById('status');
      let playbackId = 0;

      function stopAnnouncement(updateStatus = true) {
        playbackId += 1;
        audio.pause();
        audio.currentTime = 0;
        if (updateStatus) status.textContent = 'AUDIO STOPPED';
      }

      document.querySelectorAll('[data-language]').forEach((button) => {
        button.addEventListener('click', async () => {
          const language = button.dataset.language;
          stopAnnouncement(false);
          const currentPlayback = ++playbackId;
          audio.src = files[language];
          status.textContent = `PLAYING: ${language}`;
          try {
            await audio.play();
          } catch (error) {
            if (currentPlayback !== playbackId) return;
            status.textContent = `UNABLE TO PLAY: ${language}`;
            console.warn(`[AUDIO] unable to play ${language}: ${error.message}`);
          }
        });
      });

      document.getElementById('stop').addEventListener('click', () => stopAnnouncement());
      audio.addEventListener('ended', () => { status.textContent = 'AUDIO SYSTEM READY'; });
    </script>
  </body>
</html>
